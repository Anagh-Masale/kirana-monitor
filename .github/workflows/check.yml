name: kirana-check

on:
  repository_dispatch:
    types: [kc-check]      # Cloudflare har 30 min yahi trigger bhejta hai (time par)
  workflow_dispatch:       # manual test ke liye

concurrency:
  group: kc-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install -q playwright==1.49.1
          python -m playwright install --with-deps chromium > /dev/null
      - name: Check portal
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: python collector/collect.py
